<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acesso protegido</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f2ef;
        --surface: #fffdfb;
        --line: #d8d0c7;
        --text: #26211e;
        --muted: #756c65;
        --accent: #a43d4a;
        --danger: #9f2f2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(255, 253, 251, 0.9), rgba(245, 242, 239, 0.66)),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 253, 251, 0.92);
        box-shadow: 0 24px 60px rgba(38, 33, 30, 0.14);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.05;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      button {
        width: 100%;
        border-radius: 8px;
        font: inherit;
      }

      input {
        border: 1px solid var(--line);
        padding: 12px;
        background: var(--surface);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      button {
        margin-top: 14px;
        border: 0;
        padding: 12px;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: var(--danger);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Acesso protegido</h1>
      <p>Digite a senha para abrir o editor de álbuns.</p>
      <form id="loginForm">
        <label>
          Senha
          <input id="password" type="password" autocomplete="current-password" autofocus />
        </label>
        <button type="submit">Entrar</button>
        <div id="error" class="error"></div>
      </form>
    </main>

    <script>
      const form = document.querySelector("#loginForm");
      const password = document.querySelector("#password");
      const error = document.querySelector("#error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";

        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ password: password.value }),
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) {
          error.textContent = data.error || "Não foi possível entrar.";
          return;
        }

        window.location.href = "/";
      });
    </script>
  </body>
</html>
