services:
  - type: web
    name: album-editor-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ACCESS_PASSWORD
        sync: false
      - key: ACCESS_SESSION_SECRET
        sync: false
